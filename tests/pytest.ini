[pytest]
# tests/<action>/ may reuse a file name across actions (test_install.py in
# every setup): importlib mode keys modules on their path, not their name.
# The runner tests are deselected by default; a CI step after the real
# action passes -m runner, which overrides the -m below.
addopts = --import-mode=importlib -m "not runner"
markers =
    runner: runs on a GitHub runner after the action ran for real there, on the step outputs the CI step passes as env
