version: 2
updates:
  # The workflows under .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  # The steps a composite action pins.
  - package-ecosystem: github-actions
    directory: /setup-copilot
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: github-actions
    directory: /setup-opencode
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
