name: ci

on:
  pull_request:
  push:
    branches: [main]

# The jobs run pull-request-controlled code (the actions of the PR's
# tree): state least privilege here instead of relying on the
# repository default; the one job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          # The release archive and its checksums, from rhysd/actionlint's
          # own release assets, verified before extracting; the binary
          # lands at the repository root.
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$asset" "${base}/${asset}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$asset" actionlint
          rm -f "$asset" checksums.txt
          # actionlint 1.7.12 predates the copilot-requests permission scope
          # (GitHub, 2026-07-02); the one scope it does not know is ignored.
          ./actionlint -color -ignore 'unknown permission scope "copilot-requests"'
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: shellcheck the actions' bash steps
        # actionlint parses workflows only; a composite action's run
        # blocks are checked one by one (shellcheck ships on the runner).
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/shellcheck_actions.py

  setup-copilot:
    # The action for real, on a bare checkout: the newest release and a
    # pinned one, on both runner families. The headless smoke - the CLI
    # running a packaged prompt - authenticates with the workflow's own
    # token (copilot-requests: write) and runs on one cell only, never on
    # a fork's PR (the permission is not granted there, and the request
    # is billed to this repository); the token reaches that one step,
    # never the install, and the launch line scopes what the run may do.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        oddyssey-version: [latest, v1.12.0]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        # No model: the default is what runs, the smoke included.
        uses: ./setup-copilot
        with:
          oddyssey-version: ${{ matrix.oddyssey-version }}
      - name: The runner carries what the action says it installed
        env:
          REQUESTED: ${{ matrix.oddyssey-version }}
          RESOLVED: ${{ steps.setup.outputs.oddyssey-version }}
          COPILOT_VERSION: ${{ steps.setup.outputs.copilot-version }}
          MODEL: ${{ steps.setup.outputs.model }}
        run: |
          set -euo pipefail
          answer="$(copilot --version)"
          case "${answer%%$'\n'*}" in *"$COPILOT_VERSION"*) ;; *) echo "copilot --version says: ${answer}"; exit 1 ;; esac
          echo "$RESOLVED" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$REQUESTED" != "latest" ]; then [ "$RESOLVED" = "$REQUESTED" ]; fi
          [ "$COPILOT_MODEL" = "$MODEL" ]
          [ "$ODDYSSEY_CLI" = "copilot" ] && [ "$ODDYSSEY_MODEL" = "$MODEL" ]
          # The nine skills oddyssey ships: deployed, and listed by the CLI
          # (read once into a file: the CLI dies of EPIPE when a grep
          # closes its pipe early).
          copilot skill list > "$RUNNER_TEMP/skills.txt"
          for skill in backend-configuration get-status k6-guides observability-cli-guides odd-memory otel-guides package-layout run-scenario setup-local-stack; do
            test -f "$HOME/.agents/skills/${skill}/SKILL.md"
            grep -Eq "(^|[[:space:]])${skill}([[:space:]]|$)" "$RUNNER_TEMP/skills.txt"
          done
          test -f "$HOME/.copilot/prompts/odd-status.prompt.md"
          test -f "$HOME/.copilot/mcp-config.json"
          # The checkout stays clean.
          test -z "$(git status --porcelain)"
      - name: Headless smoke - the packaged /odd-status on the bare checkout
        if: >-
          matrix.os == 'ubuntu-latest' && matrix.oddyssey-version == 'latest'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ steps.setup.outputs.model }}
        run: |
          set -euo pipefail
          # The launch line the action's README documents, scoped: tools
          # auto-approved (non-interactive mode requires it), file access
          # to the skills only, no instructions from the checkout, the
          # built-in GitHub MCP server off, the token stripped from the
          # shells the run opens, the pinned CLI version and nothing newer.
          copilot -p "/odd-status" --allow-all-tools --add-dir "$HOME/.agents/skills" \
            --no-ask-user --no-custom-instructions --disable-builtin-mcps \
            --secret-env-vars GITHUB_TOKEN --no-auto-update \
            --output-format json --usage-output-file "$RUNNER_TEMP/usage.json" \
            < /dev/null > "$RUNNER_TEMP/run.jsonl"
          # The run called the packaged skill, on the model the input named,
          # and answered.
          python3 - "$RUNNER_TEMP/run.jsonl" "$RUNNER_TEMP/usage.json" "$MODEL" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          skill_called, models, answer = False, set(), ""
          for line in open(sys.argv[1]):
              line = line.strip()
              if not line:
                  continue
              event = json.loads(line)
              data = event.get("data") or {}
              if event.get("type") == "tool.execution_start" and data.get("toolName") == "skill" and (data.get("arguments") or {}).get("skill") == "get-status":
                  skill_called = True
              if event.get("type") == "model.call_start" and data.get("model"):
                  models.add(data["model"])
              if event.get("type") == "assistant.message" and data.get("content"):
                  answer = data["content"]
          usage = json.load(open(sys.argv[2]))
          verdict = f"skill get-status called: {skill_called}; models: {sorted(models)}; premium requests: {usage.get('totalPremiumRequestCost')}"
          print(verdict, file=sys.stderr)
          print("### headless /odd-status\n")
          print(verdict + "\n")
          print(answer)
          sys.exit(0 if skill_called and answer and sys.argv[3] in models else 1)
          PY

  setup-opencode:
    # The action for real, on a bare checkout, same matrix. The smoke -
    # opencode running the packaged odd-status command through the
    # repository's OpenRouter key - spends that key: the whole job skips on
    # a fork's PR, where the secret is withheld anyway (a skipped required
    # check satisfies the ruleset).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        oddyssey-version: [latest, v1.12.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        # No model, no endpoint: the defaults are what run, the smoke included.
        uses: ./setup-opencode
        with:
          oddyssey-version: ${{ matrix.oddyssey-version }}
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY }}
      - name: The runner carries what the action says it installed
        env:
          REQUESTED: ${{ matrix.oddyssey-version }}
          RESOLVED: ${{ steps.setup.outputs.oddyssey-version }}
          OPENCODE_VERSION: ${{ steps.setup.outputs.opencode-version }}
          MODEL: ${{ steps.setup.outputs.model }}
        run: |
          set -euo pipefail
          [ "$(opencode --version | tr -d '[:space:]')" = "$OPENCODE_VERSION" ]
          echo "$RESOLVED" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$REQUESTED" != "latest" ]; then [ "$RESOLVED" = "$REQUESTED" ]; fi
          [ "$ODDYSSEY_CLI" = "opencode" ] && [ "$ODDYSSEY_MODEL" = "$MODEL" ]
          # The nine skills oddyssey ships, the commands, the config with
          # the provider and the MCP server, the key file for the user only.
          for skill in backend-configuration get-status k6-guides observability-cli-guides odd-memory otel-guides package-layout run-scenario setup-local-stack; do
            test -f "$HOME/.config/opencode/skills/${skill}/SKILL.md"
          done
          test -f "$HOME/.config/opencode/commands/odd-status.md"
          grep -q '"openai-compatible"' "$HOME/.config/opencode/opencode.json"
          grep -q '"oddyssey"' "$HOME/.config/opencode/opencode.json"
          [ "$(stat -c '%a' "$RUNNER_TEMP/opencode/api-key" 2>/dev/null || stat -f '%Lp' "$RUNNER_TEMP/opencode/api-key")" = "600" ]
          opencode models openai-compatible | grep -qxF "$MODEL"
          # The checkout stays clean.
          test -z "$(git status --porcelain)"
      - name: Headless smoke - the packaged odd-status command on the bare checkout
        if: matrix.os == 'ubuntu-latest' && matrix.oddyssey-version == 'latest'
        env:
          MODEL: ${{ steps.setup.outputs.model }}
        run: |
          set -euo pipefail
          # opencode expands the command itself (--command); --auto is what
          # non-interactive mode requires; the events stream to a file.
          opencode run --model "$MODEL" --format json --auto --title "ci smoke" \
            --command odd-status "" < /dev/null > "$RUNNER_TEMP/run.jsonl"
          # The run called the packaged skill and answered.
          python3 - "$RUNNER_TEMP/run.jsonl" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          skill_called, texts = False, []
          for line in open(sys.argv[1]):
              line = line.strip()
              if not line:
                  continue
              event = json.loads(line)
              part = event.get("part") or {}
              if event.get("type") == "tool_use" and part.get("tool") == "skill" and (part.get("state") or {}).get("input", {}).get("name") == "get-status":
                  skill_called = True
              if event.get("type") == "text" and part.get("text"):
                  texts.append(part["text"])
          answer = texts[-1] if texts else ""
          verdict = f"skill get-status called: {skill_called}; text events: {len(texts)}"
          print(verdict, file=sys.stderr)
          print("### headless odd-status (opencode)\n")
          print(verdict + "\n")
          print(answer)
          sys.exit(0 if skill_called and answer else 1)
          PY
