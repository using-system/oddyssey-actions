name: ci

on:
  pull_request:
  push:
    branches: [main]

# The jobs run pull-request-controlled code (the actions of the PR's
# tree): state least privilege here instead of relying on the
# repository default; the one job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          # The release archive and its checksums, from rhysd/actionlint's
          # own release assets, verified before extracting; the binary
          # lands at the repository root.
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$asset" "${base}/${asset}"
          curl -fsSL --retry 3 -o checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$asset" actionlint
          rm -f "$asset" checksums.txt
          # actionlint 1.7.12 predates the copilot-requests permission scope
          # (GitHub, 2026-07-02); the one scope it does not know is ignored.
          ./actionlint -color -ignore 'unknown permission scope "copilot-requests"'
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: shellcheck the actions' scripts
        # actionlint parses workflows only; an action's steps are the
        # scripts under <action>/scripts/, the shared resolve step under
        # scripts/ (shellcheck ships on the runner).
        run: shellcheck --severity=style ./scripts/*.sh ./*/scripts/*.sh
      - name: ruff
        run: |
          uvx ruff@0.16.4 check ./*/scripts ./tests
          uvx ruff@0.16.4 format --check ./*/scripts ./tests

  tests:
    # One cell per action: its tests/<action>/ tree, first off the runner
    # (each script of the checkout's action run with fake tools on PATH),
    # then the action for real on this bare checkout and the tree's
    # `runner` tests on what the runner carries. A setup runs on both
    # runner families, the newest oddyssey release and an exact pin at
    # the minimum (ODDYSSEY_MINIMUM_VERSION: the cell proves the pin
    # holds, not the floor);
    # odd-status runs once per CLI, on ubuntu and latest, through that
    # CLI's setup. `uses:` takes no expression, so each action has its
    # step here, gated on the cell - adding an action is its tests/ tree,
    # a matrix line and one gated `uses:` line.
    #
    # The Copilot smoke runs on the workflow's token, which odd-status
    # reads itself on its Copilot step (copilot-requests: write here), the
    # opencode smoke on the repository's endpoint key, the Claude Code
    # smoke on the repository's OAuth token: they spend money or hold a
    # secret, so none runs on a fork's PR - the setup
    # still does, with a placeholder key no step of the setup spends, so
    # every cell reports its required check (a job-level condition would
    # collapse the matrix into one unexpanded check the ruleset never
    # sees). opencode has no --no-custom-instructions: the checkout's
    # AGENTS.md reaches that run; accepted, since it runs on this
    # repository's own branches only.
    strategy:
      fail-fast: false
      matrix:
        action: [setup-copilot, setup-opencode, setup-claude]
        os: [ubuntu-latest, macos-latest]
        oddyssey-version: [latest, v1.12.2]
        include:
          - { action: odd-status, cli: copilot, os: ubuntu-latest, oddyssey-version: latest }
          - { action: odd-status, cli: opencode, os: ubuntu-latest, oddyssey-version: latest }
          - { action: odd-status, cli: claude, os: ubuntu-latest, oddyssey-version: latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      copilot-requests: write
    env:
      ACTION: ${{ matrix.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: The action's tests, off the runner
        # the closure (pluggy, iniconfig, packaging) bounded to the pin's date
        run: uv run --no-project --exclude-newer 2026-09-16 --with pytest==9.0.2 --with pyyaml==6.0.3 pytest -v "./tests/${ACTION}"
      - id: setup-copilot
        if: matrix.action == 'setup-copilot' || matrix.cli == 'copilot'
        # No model: the default is what runs, the smoke included.
        uses: ./setup-copilot
        with:
          oddyssey-version: ${{ matrix.oddyssey-version }}
      - id: setup-opencode
        if: matrix.action == 'setup-opencode' || matrix.cli == 'opencode'
        # No model, no endpoint: the defaults are what run, the smoke included.
        uses: ./setup-opencode
        with:
          oddyssey-version: ${{ matrix.oddyssey-version }}
          openai-api-key: ${{ secrets.OPENROUTER_API_KEY || 'fork-pr-placeholder-key' }}
      - id: setup-claude
        if: matrix.action == 'setup-claude' || matrix.cli == 'claude'
        # No model: the default is what runs, the smoke included. The
        # OAuth token is the repository's (the smoke is billed to that
        # subscription); a fork's PR gets a placeholder no step of the
        # setup spends. The API key path has no smoke: no key is held.
        uses: ./setup-claude
        with:
          oddyssey-version: ${{ matrix.oddyssey-version }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || 'fork-pr-placeholder-token' }}
      - id: odd-status
        if: >-
          matrix.action == 'odd-status'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        timeout-minutes: 10
        uses: ./odd-status
        with:
          prompt: the whole loop
      - name: The runner carries what the action says it ran
        # a setup's outputs, or odd-status's verdict, as the runner tests read them
        if: matrix.action != 'odd-status' || steps.odd-status.outcome == 'success'
        env:
          REQUESTED: ${{ matrix.oddyssey-version }}
          RESOLVED: ${{ steps.setup-copilot.outputs.oddyssey-version || steps.setup-opencode.outputs.oddyssey-version || steps.setup-claude.outputs.oddyssey-version }}
          MODEL: ${{ steps.setup-copilot.outputs.model || steps.setup-opencode.outputs.model || steps.setup-claude.outputs.model }}
          COPILOT_VERSION: ${{ steps.setup-copilot.outputs.copilot-version }}
          OPENCODE_VERSION: ${{ steps.setup-opencode.outputs.opencode-version }}
          CLAUDE_VERSION: ${{ steps.setup-claude.outputs.claude-version }}
          STATUS: ${{ steps.odd-status.outputs.status }}
          SUMMARY: ${{ steps.odd-status.outputs.summary }}
          TODO: ${{ steps.odd-status.outputs.todo }}
          REPORT: ${{ steps.odd-status.outputs.report }}
        run: uv run --no-project --exclude-newer 2026-09-16 --with pytest==9.0.2 --with pyyaml==6.0.3 pytest -v -s -m runner "./tests/${ACTION}"
