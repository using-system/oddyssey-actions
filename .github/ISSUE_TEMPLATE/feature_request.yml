name: Feature request
description: A new action, or an improvement to one - an input, an output, a runner it should support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The friction
      description: What real workflow does the current behavior make painful? Concrete beats abstract.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would change, and - if there are options - the trade-offs you see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workaround today
      description: How you cope without it (helps calibrate priority).
