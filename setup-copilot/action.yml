name: "Setup Copilot for oddyssey"
description: >-
  Install the GitHub Copilot CLI and the oddyssey package on the runner,
  ready for a headless `copilot -p` step that runs an oddyssey prompt.
author: using-system
branding:
  icon: terminal
  color: purple

inputs:
  model:
    description: >-
      The Copilot model the missions run on, as the CLI's model picker
      names it (`gpt-5.6-luna`, `claude-sonnet-5`, ...). Exported to the
      later steps as COPILOT_MODEL (which `--model` on a launch line
      overrides) and as ODDYSSEY_MODEL; never written to a config file.
      Defaults to `gpt-5.6-luna`, the cheapest model the oddyssey
      benchmark measured.
    required: false
    default: gpt-5.6-luna
  oddyssey-version:
    description: >-
      The oddyssey release to install: a release tag (`v1.12.2`), a
      full commit SHA, or `latest`, the newest release tag at the time
      the workflow runs. A tag below the minimum this release of the
      actions supports (ODDYSSEY_MINIMUM_VERSION at the repository
      root) installs the minimum instead, and the run says so.
    required: false
    default: latest

outputs:
  copilot-version:
    description: The Copilot CLI version installed (`1.0.85`).
    value: ${{ steps.copilot.outputs.version }}
  oddyssey-version:
    description: The oddyssey ref resolved and installed (`v1.12.2`, or the SHA given).
    value: ${{ steps.resolve.outputs.version }}
  model:
    description: The `model` input, echoed for the launch line.
    value: ${{ inputs.model }}

runs:
  using: composite
  steps:
    - name: Resolve the oddyssey release
      id: resolve
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/resolve.sh
        REQUESTED: ${{ inputs.oddyssey-version }}
      run: "$SCRIPT"

    - name: Install the Copilot CLI
      id: copilot
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/install-copilot.sh
        # The CLI release this action installs - pinned, bumped here on
        # purpose (AGENTS.md lists it). Its archive is fetched from the
        # release's own assets and verified against the release's
        # SHA256SUMS before anything is extracted; the step fails when the
        # checksums cannot be read. No installer script, no token.
        COPILOT_CLI_VERSION: "1.0.85"
        PREFIX: ${{ runner.temp }}/copilot-cli
      run: "$SCRIPT"

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # The uv release this action installs - pinned, bumped here on
        # purpose (AGENTS.md lists it): a version the pinned setup-uv
        # bundles a checksum table for, so the binary is verified against
        # that table, fixed with the action's SHA, on every platform (a
        # `checksum:` input would name one platform's); the asset's URL
        # alone comes from Astral's versions manifest at run time. No
        # token: the download is anonymous, from Astral's mirror or the
        # release's assets. No Actions cache: nothing is hashed for a key,
        # restored or saved (setup-uv still reads the checkout's uv.toml
        # and pyproject.toml, and runs `uv python find` there).
        version: "0.12.12"
        github-token: ""
        enable-cache: false

    - name: Install the oddyssey package for the copilot target
      id: package
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/install-package.sh
        # oddyssey's own apm-cli pin (its CONTRIBUTING.md): the minimum
        # version that deploys the package whole. Bump it when oddyssey does,
        # and move the date with it: uvx resolves apm-cli's dependency
        # closure from PyPI at run time, and the date bounds that
        # resolution to what existed when the pin was set.
        APM_CLI_VERSION: "0.30.0"
        APM_CLI_PINNED_ON: "2026-09-16"
        VERSION: ${{ steps.resolve.outputs.version }}
        MODEL: ${{ inputs.model }}
      run: "$SCRIPT"

    - name: What the runner carries
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/summary.sh
        COPILOT_VERSION: ${{ steps.copilot.outputs.version }}
        VERSION: ${{ steps.resolve.outputs.version }}
        SKILLS: ${{ steps.package.outputs.skills }}
        NOTE: ${{ steps.resolve.outputs.note }}
        MODEL: ${{ inputs.model }}
      run: "$SCRIPT"
