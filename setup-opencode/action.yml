name: "Setup opencode for oddyssey"
description: >-
  Install opencode and the oddyssey package on the runner, an
  OpenAI-compatible endpoint as its model provider, ready for a later
  step that runs an oddyssey prompt.
author: using-system
branding:
  icon: terminal
  color: purple

inputs:
  model:
    description: >-
      The model the missions run on, as the endpoint names it
      (`openai/gpt-5.6-luna` on OpenRouter). Declared to opencode under
      the `openai-compatible` provider and exported to the later steps as
      ODDYSSEY_MODEL in opencode's `provider/model` form. Defaults to
      `openai/gpt-5.6-luna`, the cheapest model the oddyssey benchmark
      measured.
    required: false
    default: openai/gpt-5.6-luna
  oddyssey-version:
    description: >-
      The oddyssey release to install: a release tag (`v1.12.2`), a
      full commit SHA, or `latest`, the newest release tag at the time
      the workflow runs. A tag below the minimum this release of the
      actions supports (ODDYSSEY_MINIMUM_VERSION at the repository
      root) installs the minimum instead, and the run says so.
    required: false
    default: latest
  openai-base-url:
    description: >-
      The OpenAI-compatible endpoint (`/v1/chat/completions` behind it)
      the model is served from. Defaults to OpenRouter's.
    required: false
    default: https://openrouter.ai/api/v1
  openai-api-key:
    description: >-
      The API key of that endpoint - a secret. Written to a file under the
      runner's temporary directory that opencode's provider reads; never
      written to GITHUB_ENV (no later step sees it), never printed.
    required: true

outputs:
  opencode-version:
    description: The opencode version installed (`1.18.31`).
    value: ${{ steps.opencode.outputs.version }}
  oddyssey-version:
    description: The oddyssey ref resolved and installed (`v1.12.2`, or the SHA given).
    value: ${{ steps.resolve.outputs.version }}
  model:
    description: The model in opencode's form (`openai-compatible/openai/gpt-5.6-luna`).
    value: openai-compatible/${{ inputs.model }}

runs:
  using: composite
  steps:
    - name: Check the inputs
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/check.sh
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.openai-base-url }}
      run: "$SCRIPT"

    - name: Resolve the oddyssey release
      id: resolve
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/resolve.sh
        REQUESTED: ${{ inputs.oddyssey-version }}
      run: "$SCRIPT"

    - name: Install opencode
      id: opencode
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/install-opencode.sh
        # The opencode release this action installs - pinned, bumped here
        # on purpose with the four checksums below (AGENTS.md lists it).
        # opencode publishes no checksum file: these were computed from
        # the release's assets when the pin was set, and the archive is
        # verified against them before anything is extracted.
        OPENCODE_VERSION: "1.18.31"
        SHA256_LINUX_X64: "e9312be75ed803b7415fc2aeabda1f4fe938912a39673762dc0c38c0e11ebde4"
        SHA256_LINUX_ARM64: "d4e332f46b227448582c0d9fc75f6f826dfe95c9f751bc2011fc4d937a042be6"
        SHA256_DARWIN_ARM64: "caf7f31fa1aec2353ea859d4ef9ab824c6273d941b016e88d51193fa3028d34e"
        SHA256_DARWIN_X64: "f8510eaf400f07c3a2014e3a517e3650c705bcd6ac3e6740351b723ee685042f"
        PREFIX: ${{ runner.temp }}/opencode
      run: "$SCRIPT"

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

    - name: Install the oddyssey package for the opencode target
      id: package
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/install-package.sh
        # oddyssey's own apm-cli pin (its CONTRIBUTING.md), and the date
        # that bounds the closure uvx resolves from PyPI at run time. Bump
        # both when oddyssey bumps the pin.
        APM_CLI_VERSION: "0.30.0"
        APM_CLI_PINNED_ON: "2026-09-16"
        VERSION: ${{ steps.resolve.outputs.version }}
      run: "$SCRIPT"

    - name: Configure opencode - the provider, the model, the MCP server
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/configure.sh
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.openai-base-url }}
        API_KEY: ${{ inputs.openai-api-key }}
        KEY_FILE: ${{ runner.temp }}/opencode/api-key
        PYYAML_VERSION: "6.0.3"
      run: "$SCRIPT"

    - name: What the runner carries
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/summary.sh
        OPENCODE_VERSION: ${{ steps.opencode.outputs.version }}
        VERSION: ${{ steps.resolve.outputs.version }}
        SKILLS: ${{ steps.package.outputs.skills }}
        NOTE: ${{ steps.resolve.outputs.note }}
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.openai-base-url }}
      run: "$SCRIPT"
