name: "oddyssey odd-status"
description: >-
  Run the packaged /odd-status through the CLI a setup action installed,
  and turn its verdict into outputs a workflow can gate on.
author: using-system
branding:
  icon: activity
  color: purple

inputs:
  prompt:
    description: >-
      What the status is about, in the caller's words - a service, a
      stack, a question (`the checkout service on prod`). Passed to the
      packaged command as its arguments; empty for the whole loop.
    required: false
    default: ""
  fail-on:
    description: >-
      Fail the step when the judged status reaches this level: `warning`
      (warning or error fail), `error` (error fails), or `none` (the
      outputs carry the verdict; the step still fails when the run
      produced no answer).
    required: false
    default: none
  token:
    description: >-
      The token the Copilot run authenticates with, set as `GITHUB_TOKEN`
      on the Copilot launch step and nowhere else; the opencode run never
      receives it. Defaults to the workflow's own token, which needs the
      job permission `copilot-requests: write`; a user token when the run
      must be billed to a user. The action passes it as given.
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: The model's judgement of the loop's state - `ok`, `warning` or `error`.
    value: ${{ steps.verdict.outputs.status }}
  summary:
    description: One sentence on that judgement.
    value: ${{ steps.verdict.outputs.summary }}
  todo:
    description: The next actions, most urgent first, as a JSON array of {action, why}.
    value: ${{ steps.verdict.outputs.todo }}
  report:
    description: The run's whole answer, the status as the packaged command renders it.
    value: ${{ steps.verdict.outputs.report }}

runs:
  using: composite
  steps:
    - name: Check the setup and the inputs
      id: check
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        FAIL_ON: ${{ inputs.fail-on }}
        ARGUMENTS_FILE: ${{ runner.temp }}/odd-status-arguments.txt
        # The verdict the run must end with - the contract scripts/verdict.py
        # parses. The judgement is the model's; the shape is not.
        INSTRUCTION: >-
          Then end your answer with exactly one fenced json code block and
          nothing after it, of the form
          {"status": "ok" | "warning" | "error", "summary": "<one sentence>",
          "todo": [{"action": "<what to do next>", "why": "<the evidence>"}]}.
          Judge the status yourself from the loop's state: error when
          something demands a fix before the next step (a verification that
          failed, a regression, a finding past its due date, a report that
          could not be read), warning when something is due or degraded but
          not blocking (a report older than its cadence, an open telemetry
          gap, a loop not started), ok when nothing is due. The todo lists
          the next actions, most urgent first, and is empty when nothing is
          due.
      run: |
        set -euo pipefail
        case "$FAIL_ON" in none|warning|error) ;; *)
          echo "::error::fail-on must be none, warning or error, got '${FAIL_ON}'."; exit 1 ;;
        esac
        # The prompt is the command's positional argument: one starting
        # with a dash would be read as a flag of the CLI.
        case "$PROMPT" in -*)
          echo "::error::prompt must not start with a dash."; exit 1 ;;
        esac
        if [ -z "${ODDYSSEY_CLI:-}" ] || [ -z "${ODDYSSEY_MODEL:-}" ]; then
          echo "::error::ODDYSSEY_CLI and ODDYSSEY_MODEL are not set - run a setup action (setup-copilot, setup-opencode) earlier in the job."
          exit 1
        fi
        case "$ODDYSSEY_CLI" in copilot|opencode) ;; *)
          echo "::error::ODDYSSEY_CLI is '${ODDYSSEY_CLI}' - this action runs copilot or opencode."; exit 1 ;;
        esac
        # The command's arguments, handed to the launch step through a
        # file: the prompt is the caller's text and never goes through
        # GITHUB_OUTPUT or GITHUB_ENV.
        printf '%s\n\n%s\n' "$PROMPT" "$INSTRUCTION" > "$ARGUMENTS_FILE"
        echo "cli=${ODDYSSEY_CLI}" >> "$GITHUB_OUTPUT"
        echo "odd-status through ${ODDYSSEY_CLI} on ${ODDYSSEY_MODEL}${PROMPT:+ - $(printf '%s' "$PROMPT" | tr '\n\r' '  ')}"

    - name: Run the packaged odd-status through Copilot
      if: steps.check.outputs.cli == 'copilot'
      shell: bash
      env:
        ARGUMENTS_FILE: ${{ runner.temp }}/odd-status-arguments.txt
        EVENTS: ${{ runner.temp }}/odd-status-events.jsonl
        # The token of this step and of no other: the CLI reads it from
        # GITHUB_TOKEN; the workflow's own by default (copilot-requests:
        # write on the job), or the one the token input names.
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "::error::the token input is empty - the Copilot run authenticates with it (the workflow's token by default, under copilot-requests: write)."
          exit 1
        fi
        # The CLI reads COPILOT_GITHUB_TOKEN, then GH_TOKEN, then
        # GITHUB_TOKEN (its `help environment`): either of the first two
        # in this step's environment would silently replace the token
        # input. The token input is the one path.
        for other in COPILOT_GITHUB_TOKEN GH_TOKEN; do
          if [ -n "${!other:-}" ]; then
            echo "::error::${other} is set in the step's environment and the Copilot CLI would prefer it over the token input - pass that token as the action's token input instead, and unset ${other}."
            exit 1
          fi
        done
        arguments="$(cat "$ARGUMENTS_FILE")"
        # The Copilot CLI does not expand a slash command: the text reaches
        # the model as written and the model routes it to the packaged
        # skill. Scoped: tools auto-approved (non-interactive mode requires
        # it), file access to the skills only, no instructions from the
        # checkout, the built-in GitHub MCP server off, the token stripped
        # from the shells the run opens, the installed version and nothing
        # newer.
        copilot -p "/odd-status ${arguments}" --model "$ODDYSSEY_MODEL" \
          --allow-all-tools --add-dir "$HOME/.agents/skills" \
          --no-ask-user --no-custom-instructions --disable-builtin-mcps \
          --secret-env-vars GITHUB_TOKEN --no-auto-update \
          --output-format json < /dev/null > "$EVENTS"

    - name: Run the packaged odd-status through opencode
      if: steps.check.outputs.cli == 'opencode'
      shell: bash
      env:
        ARGUMENTS_FILE: ${{ runner.temp }}/odd-status-arguments.txt
        EVENTS: ${{ runner.temp }}/odd-status-events.jsonl
      run: |
        set -euo pipefail
        arguments="$(cat "$ARGUMENTS_FILE")"
        # opencode expands the packaged command itself; --auto is what
        # non-interactive mode requires. No token: the provider's key is
        # the setup's, in the file opencode's config points at.
        opencode run --model "$ODDYSSEY_MODEL" --format json --auto --title "odd-status" \
          --command odd-status "$arguments" < /dev/null > "$EVENTS"

    - name: The verdict
      id: verdict
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        EVENTS: ${{ runner.temp }}/odd-status-events.jsonl
        SCRIPT: ${{ github.action_path }}/scripts/verdict.py
      run: |
        set -euo pipefail
        python3 "$SCRIPT" --cli "$ODDYSSEY_CLI" --events "$EVENTS" --fail-on "$FAIL_ON" \
          --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
