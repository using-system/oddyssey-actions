name: "oddyssey odd-status"
description: >-
  Run the packaged /odd-status through the CLI a setup action installed
  (Copilot, opencode or Claude Code), and turn its verdict into outputs a
  workflow can gate on.
author: using-system
branding:
  icon: activity
  color: purple

inputs:
  prompt:
    description: >-
      What the status is about, in the caller's words - a service, a
      stack, a question (`the checkout service on prod`). Passed to the
      packaged command as its arguments, and the bound of the scope the
      verdict is recomputed with (name the service, the stack and the
      environment as the reports name them); empty for the whole loop.
    required: false
    default: ""
  fail-on:
    description: >-
      Fail the step when the status reaches this level: `warning`
      (warning or error fail), `error` (error fails), or `none` (the
      outputs carry the verdict; the step still fails when the run
      produced no answer).
    required: false
    default: none
  token:
    description: >-
      The token the Copilot run authenticates with, set as `GITHUB_TOKEN`
      on the Copilot launch step and nowhere else; the opencode and Claude
      Code steps receive none from this action (a job token
      `actions/checkout` persisted in the checkout is another matter: the
      README's examples set `persist-credentials: false`). Defaults to the
      workflow's own token, which needs the job permission
      `copilot-requests: write`; a user token when the run must be billed
      to a user. The action passes it as given.
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: >-
      The loop's verdict - `ok`, `warning` or `error` - as the package's
      own get-status script computes it: the verdict step runs that
      script again on the checkout, scoped as the prompt names (the
      run's rulings are its own and are dropped), and reads the verdict
      line its rendering opens with - never a line of the model's
      answer. `error` when the script cannot compute (not found, a flag
      or a scope the action does not pass on, a failure), and the step
      then fails whatever fail-on says.
    value: ${{ steps.verdict.outputs.status }}
  summary:
    description: One sentence on that verdict, the model's.
    value: ${{ steps.verdict.outputs.summary }}
  todo:
    description: >-
      The next actions, most urgent first, as a JSON array of {action, why} -
      the todo line of that same rendering.
    value: ${{ steps.verdict.outputs.todo }}
  report:
    description: The run's whole answer, the status as the packaged command renders it.
    value: ${{ steps.verdict.outputs.report }}

runs:
  using: composite
  steps:
    - name: Check the setup and the inputs
      id: check
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/check.sh
        PROMPT: ${{ inputs.prompt }}
        FAIL_ON: ${{ inputs.fail-on }}
        ARGUMENTS_FILE: ${{ runner.temp }}/odd-status-arguments.txt
      run: "$SCRIPT"

    - name: Run the packaged odd-status through Copilot
      if: steps.check.outputs.cli == 'copilot'
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/run-copilot.sh
        COMMAND: odd-status
        ARGUMENTS_FILE: ${{ runner.temp }}/odd-status-arguments.txt
        EVENTS: ${{ runner.temp }}/odd-status-events.jsonl
        # The token of this step and of no other: the CLI reads it from
        # GITHUB_TOKEN; the workflow's own by default (copilot-requests:
        # write on the job), or the one the token input names.
        GITHUB_TOKEN: ${{ inputs.token }}
      run: "$SCRIPT"

    - name: Run the packaged odd-status through opencode
      if: steps.check.outputs.cli == 'opencode'
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/run-opencode.sh
        COMMAND: odd-status
        ARGUMENTS_FILE: ${{ runner.temp }}/odd-status-arguments.txt
        EVENTS: ${{ runner.temp }}/odd-status-events.jsonl
      run: "$SCRIPT"

    - name: Run the packaged odd-status through Claude Code
      if: steps.check.outputs.cli == 'claude'
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/scripts/run-claude.sh
        COMMAND: odd-status
        ARGUMENTS_FILE: ${{ runner.temp }}/odd-status-arguments.txt
        EVENTS: ${{ runner.temp }}/odd-status-events.jsonl
        # No token here: the credential is setup-claude's, in the file
        # its environment names; the script reads it for the CLI alone.
      run: "$SCRIPT"

    - name: The verdict
      id: verdict
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        EVENTS: ${{ runner.temp }}/odd-status-events.jsonl
        SCRIPT: ${{ github.action_path }}/scripts/verdict.py
        # The checkout the package's script is run on again: the same
        # directory the launch ran in. The prompt bounds the scope the
        # run may report.
        CHECKOUT: ${{ github.workspace }}
        PROMPT: ${{ inputs.prompt }}
      run: |
        set -euo pipefail
        python3 "$SCRIPT" --cli "$ODDYSSEY_CLI" --events "$EVENTS" --checkout "$CHECKOUT" \
          --prompt "$PROMPT" --fail-on "$FAIL_ON" --outputs "$GITHUB_OUTPUT" \
          --summary "$GITHUB_STEP_SUMMARY"
